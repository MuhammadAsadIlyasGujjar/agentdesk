server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- API calls backend container ko forward ----
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 🔴 SSE ke liye ye teen lines LAZMI hain.
    # Default nginx response ko buffer karta hai — us soorat mein streaming
    # "kaam nahi kar rahi" lagti hai (poora jawab ek saath aata hai).
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # ---- Angular SPA: har route index.html par ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
